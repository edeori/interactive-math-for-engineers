[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-math-symbolic-service"
version = "0.1.0"
description = "Bounded deterministic symbolic mathematics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "sympy>=1.14,<2",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
